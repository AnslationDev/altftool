name: Production Monitoring

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: production-monitoring
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run production monitor
        env:
          ALTFT_MONITOR_WEB_URL: ${{ vars.ALTFT_MONITOR_WEB_URL || 'https://www.altftool.com' }}
          ALTFT_MONITOR_WEB_URLS: ${{ vars.ALTFT_MONITOR_WEB_URLS }}
          ALTFT_MONITOR_ADMIN_URL: ${{ vars.ALTFT_MONITOR_ADMIN_URL || 'https://www.tier2.anslation.com' }}
          ALTFT_MONITOR_ADMIN_TOKEN: ${{ secrets.ALTFT_MONITOR_ADMIN_TOKEN }}
          ALTFT_MONITOR_ADMIN_EMAIL: ${{ secrets.ALTFT_MONITOR_ADMIN_EMAIL }}
          ALTFT_MONITOR_ADMIN_PASSWORD: ${{ secrets.ALTFT_MONITOR_ADMIN_PASSWORD }}
          ALTFT_MONITOR_FIREBASE_API_KEY: ${{ secrets.ALTFT_MONITOR_FIREBASE_API_KEY || secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          ALTFT_MONITOR_REQUIRE_ADMIN: ${{ vars.ALTFT_MONITOR_REQUIRE_ADMIN || 'false' }}
          ALTFT_MONITOR_REQUIRE_ADMIN_AUTH: ${{ vars.ALTFT_MONITOR_REQUIRE_ADMIN_AUTH || 'false' }}
          ALTFT_MONITOR_ALERT_WEBHOOK_URL: ${{ secrets.ALTFT_MONITOR_ALERT_WEBHOOK_URL }}
          ALTFT_MONITOR_ALERT_FORMAT: ${{ vars.ALTFT_MONITOR_ALERT_FORMAT || 'generic' }}
          ALTFT_MONITOR_TIMEOUT_MS: ${{ vars.ALTFT_MONITOR_TIMEOUT_MS || '15000' }}
          ALTFT_MONITOR_OUTPUT_PATH: production-monitoring-report.json
        run: npm run monitor:production

      - name: Run production link and image monitor
        env:
          ALTFT_LINK_CHECK_URL: ${{ vars.ALTFT_MONITOR_WEB_URL || 'https://www.altftool.com' }}
        run: npm run monitor:links:strict -- --limit 24 --output production-links-report.json --output-md production-links-report.md

      - name: Upload monitoring reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-monitoring-reports
          path: |
            production-monitoring-report.json
            production-links-report.json
            production-links-report.md
          if-no-files-found: ignore
