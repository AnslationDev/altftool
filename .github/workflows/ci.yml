name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "42 2 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXT_TELEMETRY_DISABLED: 1
  ALTFT_NODE_MAX_OLD_SPACE_SIZE: "12288"
  ALTFT_DISABLE_SHARED_ASYNC_VENDOR_CHUNKS: "true"
  NEXT_PUBLIC_WHEREGOES_API_URL: "https://wheregoes.example.invalid"
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "10000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "60000"

jobs:
  # Deterministic gate: install, lint, build, and fast unit tests only.
  # No live Firebase, Lighthouse, browser, or production-URL checks — so this
  # job is reproducible and is the required gate for production deploys.
  build:
    name: Build & lint (deterministic gate)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Build with placeholder Firebase config + short Firestore timeout so the
      # production build never hangs or fails on missing live credentials.
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: build-placeholder
      ALTFT_FIRESTORE_REST_TIMEOUT_MS: "500"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Scan repository for credentials
        run: npm run security:secrets

      - name: Lint (web)
        run: npm run lint:web

      - name: Validate route surface
        run: npm run routes:check

      - name: Core unit tests
        run: npm run test:core-cache

      - name: Verify tool readiness analyzer
        run: npm run test:tool-readiness

      - name: Production build (web + admin)
        run: npm run build

      - name: Enforce generated tool readiness
        run: node scripts/check-tool-readiness.mjs --strict

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # validate:full performs another production web build. Use the same
      # isolated webpack worker that the successful Amplify release build uses
      # so this exhaustive job does not spend most of its window compiling.
      ALTFT_WEBPACK_BUILD_WORKER: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Check deployment environment readiness
        run: npm run env:readiness

      - name: Verify Firebase Admin write checker wiring
        run: npm run firebase:admin-write-check:dry-run

      - name: Validate full route surface
        run: npm run validate:full

      # Local-super-admin fixtures are intentionally unavailable in production
      # builds. Exercise the route and API surfaces together under one dev
      # server so cold compilation cannot abort the production validation above.
      - name: Validate local admin route and API surface
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: npm run test:admin:ci

      - name: Write performance budget report
        run: npm run performance:budget:strict -- --output ci-performance-budget-report.json --output-md ci-performance-budget-report.md

      - name: Write Firebase integrity report
        run: npm run firebase:integrity:strict -- --output ci-firebase-integrity-report.json --output-md ci-firebase-integrity-report.md

      # Live/external checks below depend on production data, third-party
      # services, or full browser runs. They are reported but kept non-blocking
      # (continue-on-error) so transient external flakiness cannot fail CI or
      # block deploys. The deterministic "build" job remains the hard gate.
      - name: Verify live Firebase data
        continue-on-error: true
        run: npm run firebase:live-check

      - name: Verify live Firebase renders on public pages
        continue-on-error: true
        run: ALTFT_PLAYWRIGHT_WEB_SERVER=production ALTFT_SKIP_ADMIN_SERVER=true npm run test:firebase-public-pages

      # The 3,947-route serial browser crawl takes several hours and cannot fit
      # this job's bounded per-push window. `validate:full` already enforces the
      # complete registry/route surface plus functional and priority browsers;
      # exhaustive live crawls remain an explicit release operation.

      - name: Verify security headers
        run: npm run test:security:production

      - name: Run Lighthouse quality gate
        continue-on-error: true
        run: npm run test:lighthouse:production

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Upload quality gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-quality-gate-reports
          path: |
            ci-performance-budget-report.json
            ci-performance-budget-report.md
            ci-firebase-integrity-report.json
            ci-firebase-integrity-report.md
          if-no-files-found: ignore

  firebase-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Verify Firebase Admin write checker emulator branch
        run: npm run test:firebase-admin-write-check

      - name: Verify Firebase security rules against emulators
        run: npm run test:firebase-rules:emulator

      - name: Verify admin CRUD paths against Firestore Emulator
        run: npm run test:admin-crud:emulator

      - name: Verify admin-to-web sync against Firestore Emulator
        run: npm run test:admin-web-sync:emulator

  visual-regression:
    runs-on: macos-latest
    # Hosted macOS compile time varies significantly for the full tool catalog:
    # measured runs range from ~43 to ~58 minutes before static generation and
    # the snapshot suite. Keep enough headroom for both without treating runner
    # variance as an application regression.
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: build-placeholder
      ALTFT_FIRESTORE_REST_TIMEOUT_MS: "500"
      ALTFT_WEBPACK_BUILD_WORKER: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Build visual regression servers
        run: npm run build

      - name: Run visual regression
        run: ALTFT_PLAYWRIGHT_WEB_SERVER=production ALTFT_PLAYWRIGHT_ADMIN_SERVER=production npm run test:visual

      - name: Upload visual artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  deploy-production:
    name: Deploy production admin
    # Gate deploys on deterministic jobs only (build + emulator-backed rules).
    # The "verify" and "visual-regression" jobs still run for visibility but no
    # longer block production on transient live/Lighthouse/snapshot flakiness.
    # Public www is deployed from canonical-web/main through AWS Amplify. Keep
    # this monorepo workflow admin-only so a Vercel alias cannot compete with
    # the canonical web deployment or fail parity against the Amplify commit.
    needs:
      - build
      - firebase-emulator
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/vercel-deploy.yml
    with:
      target: admin
    secrets: inherit
