name: Vercel Deploy

on:
  workflow_call:
    inputs:
      target:
        description: Project to deploy
        required: false
        default: all
        type: string
    secrets:
      VERCEL_TOKEN:
        required: false
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
      VERCEL_WEB_PROJECT_ID:
        required: false
      VERCEL_ADMIN_PROJECT_ID:
        required: false
      ALTFT_MONITOR_ADMIN_TOKEN:
        required: false
      ALTFT_MONITOR_ADMIN_EMAIL:
        required: false
      ALTFT_MONITOR_ADMIN_PASSWORD:
        required: false
      ALTFT_MONITOR_FIREBASE_API_KEY:
        required: false
      ALTFT_MONITOR_ALERT_WEBHOOK_URL:
        required: false
      NEXT_PUBLIC_FIREBASE_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      target:
        description: Project to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - web
          - admin

concurrency:
  group: vercel-deploy-${{ github.ref }}-${{ inputs.target || 'all' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXT_TELEMETRY_DISABLED: 1
  ALTFT_WEBPACK_BUILD_WORKER: "true"
  WEB_PROJECT_ROOT: altftoolweb
  ADMIN_PROJECT_ROOT: altftoolwebadmin
  ALTFT_EXPECTED_GITHUB_REPO: AnslationDev/altftool
  VERCEL_CWD: .
  VERCEL_CLI_VERSION: 54.2.0

jobs:
  deploy-web:
    name: Deploy web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: inputs.target == 'all' || inputs.target == 'web'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_WEB_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
      ALTFT_MONITOR_WEB_URLS: ${{ vars.ALTFT_MONITOR_WEB_URLS || vars.ALTFT_MONITOR_WEB_URL || 'https://www.altftool.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check Vercel web secrets
        env:
          VERCEL_READINESS_OUTPUT_PATH: web-vercel-readiness-report.json
        run: npm run deploy:readiness -- --target=web

      - name: Install Vercel CLI
        run: npm install -g "vercel@$VERCEL_CLI_VERSION"

      - name: Install workspace dependencies for post-deploy checks
        run: npm ci

      - name: Pull web production environment
        run: |
          vercel link --yes --scope "$VERCEL_ORG_ID" --project "$VERCEL_WEB_PROJECT_ID" --cwd "$VERCEL_CWD" --token="$VERCEL_TOKEN"
          vercel pull --yes --environment=production --cwd "$VERCEL_CWD" --token="$VERCEL_TOKEN"

      - name: Build web deployment
        run: vercel build --prod --cwd "$VERCEL_CWD" --token="$VERCEL_TOKEN"

      - name: Deploy web prebuilt output
        id: deploy
        run: |
          deployment_output="$(vercel deploy --prebuilt --prod --archive=tgz --cwd "$VERCEL_CWD" --token="$VERCEL_TOKEN" \
            --meta altftSourceRepo="$ALTFT_EXPECTED_GITHUB_REPO" \
            --meta altftProject=web \
            --meta githubOrg=AnslationDev \
            --meta githubRepo=altftool \
            --meta githubCommitOrg=AnslationDev \
            --meta githubCommitRepo=altftool \
            --meta githubCommitRef="$GITHUB_REF_NAME" \
            --meta githubCommitSha="$GITHUB_SHA")"
          printf '%s\n' "$deployment_output"
          deployment_url="$(printf '%s\n' "$deployment_output" | grep -Eo 'https://[^[:space:]]+vercel\.app' | tail -n 1)"
          if [ -z "$deployment_url" ]; then
            echo "Could not parse Vercel deployment URL from deploy output." >&2
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Web deployment"
            echo
            echo "$deployment_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify web deployment source repo
        env:
          ALTFT_DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          ALTFT_EXPECTED_COMMIT: ${{ github.sha }}
          VERCEL_SOURCE_OUTPUT_PATH: web-vercel-source-report.json
        run: npm run deploy:source-check -- --target=web

      - name: Monitor web deployment URL
        # Immutable *.vercel.app deployment URLs can be gated by Vercel Deployment
        # Protection (401); keep this pre-alias smoke check informational only.
        continue-on-error: true
        env:
          ALTFT_MONITOR_WEB_URLS: ${{ steps.deploy.outputs.url }}
          ALTFT_MONITOR_SKIP_ADMIN: "true"
          ALTFT_MONITOR_SKIP_FIREBASE_LIVE_DATA: "true"
          ALTFT_MONITOR_ALERT_WEBHOOK_URL: ${{ secrets.ALTFT_MONITOR_ALERT_WEBHOOK_URL }}
          ALTFT_MONITOR_ALERT_FORMAT: ${{ vars.ALTFT_MONITOR_ALERT_FORMAT || 'generic' }}
          ALTFT_MONITOR_OUTPUT_PATH: web-deployment-monitoring-report.json
        run: npm run monitor:production

      - name: Monitor production web domain
        env:
          ALTFT_MONITOR_SKIP_ADMIN: "true"
          ALTFT_MONITOR_SKIP_FIREBASE_LIVE_DATA: "true"
          ALTFT_MONITOR_ALERT_WEBHOOK_URL: ${{ secrets.ALTFT_MONITOR_ALERT_WEBHOOK_URL }}
          ALTFT_MONITOR_ALERT_FORMAT: ${{ vars.ALTFT_MONITOR_ALERT_FORMAT || 'generic' }}
          ALTFT_MONITOR_OUTPUT_PATH: web-production-monitoring-report.json
        run: npm run monitor:production

      - name: Monitor production web links and images
        env:
          # www is the canonical public origin. Using the redirecting apex here
          # makes strict SEO checks misclassify every canonical URL as external.
          ALTFT_LINK_CHECK_URL: ${{ vars.ALTFT_MONITOR_CANONICAL_WEB_URL || 'https://www.altftool.com' }}
        run: npm run monitor:links:strict -- --limit 24 --output web-production-links-report.json --output-md web-production-links-report.md

      - name: Verify production web parity
        env:
          ALTFT_WEB_URL: ${{ vars.ALTFT_MONITOR_CANONICAL_WEB_URL || 'https://www.altftool.com' }}
          ALTFT_EXPECTED_COMMIT: ${{ github.sha }}
          ALTFT_PARITY_OUTPUT_PATH: web-production-parity-report.json
          ALTFT_PARITY_MARKDOWN_PATH: web-production-parity-report.md
        # Source provenance is checked against the immutable Vercel deployment
        # above. The canonical AWS release currently exposes functional health
        # but not a Git SHA, so require strict surface parity without inventing
        # a commit comparison that production cannot provide.
        run: npm run deploy:parity -- --strict --allow-missing-commit --no-browser

      - name: Upload web monitoring reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-deploy-monitoring-reports
          path: |
            web-vercel-readiness-report.json
            web-vercel-source-report.json
            web-deployment-monitoring-report.json
            web-production-monitoring-report.json
            web-production-links-report.json
            web-production-links-report.md
            web-production-parity-report.json
            web-production-parity-report.md
          if-no-files-found: ignore

  deploy-admin:
    name: Deploy admin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: inputs.target == 'all' || inputs.target == 'admin'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_ADMIN_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_ADMIN_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check Vercel admin secrets
        env:
          VERCEL_READINESS_OUTPUT_PATH: admin-vercel-readiness-report.json
        run: npm run deploy:readiness -- --target=admin

      - name: Install Vercel CLI
        run: npm install -g "vercel@$VERCEL_CLI_VERSION"

      - name: Install workspace dependencies for post-deploy checks
        run: npm ci

      - name: Upload admin readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-deploy-readiness-report
          path: admin-vercel-readiness-report.json
          if-no-files-found: ignore

      - name: Pull admin production environment
        run: |
          vercel link --yes --scope "$VERCEL_ORG_ID" --project "$VERCEL_ADMIN_PROJECT_ID" --cwd "$VERCEL_CWD" --token="$VERCEL_TOKEN"
          vercel pull --yes --environment=production --cwd "$VERCEL_CWD" --token="$VERCEL_TOKEN"

      - name: Build admin deployment
        run: vercel build --prod --cwd "$VERCEL_CWD" --token="$VERCEL_TOKEN"

      - name: Deploy admin prebuilt output
        id: deploy
        run: |
          deployment_output="$(vercel deploy --prebuilt --prod --archive=tgz --cwd "$VERCEL_CWD" --token="$VERCEL_TOKEN" \
            --meta altftSourceRepo="$ALTFT_EXPECTED_GITHUB_REPO" \
            --meta altftProject=admin \
            --meta githubOrg=AnslationDev \
            --meta githubRepo=altftool \
            --meta githubCommitOrg=AnslationDev \
            --meta githubCommitRepo=altftool \
            --meta githubCommitRef="$GITHUB_REF_NAME" \
            --meta githubCommitSha="$GITHUB_SHA")"
          printf '%s\n' "$deployment_output"
          deployment_url="$(printf '%s\n' "$deployment_output" | grep -Eo 'https://[^[:space:]]+vercel\.app' | tail -n 1)"
          if [ -z "$deployment_url" ]; then
            echo "Could not parse Vercel deployment URL from deploy output." >&2
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Admin deployment"
            echo
            echo "$deployment_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify admin deployment source repo
        env:
          ALTFT_DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          ALTFT_EXPECTED_COMMIT: ${{ github.sha }}
          VERCEL_SOURCE_OUTPUT_PATH: admin-vercel-source-report.json
        run: npm run deploy:source-check -- --target=admin

      - name: Monitor admin deployment URL
        # Immutable *.vercel.app deployment URL is gated by Vercel Deployment
        # Protection (401), so the public login-page smoke check on it is expected
        # to fail. Informational only — "Monitor production admin domain" is the gate.
        continue-on-error: true
        env:
          ALTFT_MONITOR_SKIP_WEB: "true"
          ALTFT_MONITOR_SKIP_FIREBASE_LIVE_DATA: "true"
          ALTFT_MONITOR_ADMIN_URL: ${{ steps.deploy.outputs.url }}
          ALTFT_MONITOR_ADMIN_TOKEN: ${{ secrets.ALTFT_MONITOR_ADMIN_TOKEN }}
          ALTFT_MONITOR_ADMIN_EMAIL: ${{ secrets.ALTFT_MONITOR_ADMIN_EMAIL }}
          ALTFT_MONITOR_ADMIN_PASSWORD: ${{ secrets.ALTFT_MONITOR_ADMIN_PASSWORD }}
          ALTFT_MONITOR_FIREBASE_API_KEY: ${{ secrets.ALTFT_MONITOR_FIREBASE_API_KEY || secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          ALTFT_MONITOR_ALERT_WEBHOOK_URL: ${{ secrets.ALTFT_MONITOR_ALERT_WEBHOOK_URL }}
          ALTFT_MONITOR_ALERT_FORMAT: ${{ vars.ALTFT_MONITOR_ALERT_FORMAT || 'generic' }}
          ALTFT_MONITOR_OUTPUT_PATH: admin-deployment-monitoring-report.json
        run: npm run monitor:production

      - name: Monitor production admin domain
        env:
          ALTFT_MONITOR_SKIP_WEB: "true"
          ALTFT_MONITOR_SKIP_FIREBASE_LIVE_DATA: "true"
          ALTFT_MONITOR_ADMIN_URL: ${{ vars.ALTFT_MONITOR_ADMIN_URL || 'https://adsmanager.altftool.com' }}
          ALTFT_MONITOR_ADMIN_TOKEN: ${{ secrets.ALTFT_MONITOR_ADMIN_TOKEN }}
          ALTFT_MONITOR_ADMIN_EMAIL: ${{ secrets.ALTFT_MONITOR_ADMIN_EMAIL }}
          ALTFT_MONITOR_ADMIN_PASSWORD: ${{ secrets.ALTFT_MONITOR_ADMIN_PASSWORD }}
          ALTFT_MONITOR_FIREBASE_API_KEY: ${{ secrets.ALTFT_MONITOR_FIREBASE_API_KEY || secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          ALTFT_MONITOR_ALERT_WEBHOOK_URL: ${{ secrets.ALTFT_MONITOR_ALERT_WEBHOOK_URL }}
          ALTFT_MONITOR_ALERT_FORMAT: ${{ vars.ALTFT_MONITOR_ALERT_FORMAT || 'generic' }}
          ALTFT_MONITOR_OUTPUT_PATH: admin-production-monitoring-report.json
        run: npm run monitor:production

      - name: Upload admin monitoring reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-deploy-monitoring-reports
          path: |
            admin-vercel-readiness-report.json
            admin-vercel-source-report.json
            admin-deployment-monitoring-report.json
            admin-production-monitoring-report.json
          if-no-files-found: ignore
