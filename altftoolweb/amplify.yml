version: 1
# HOST CONSOLIDATION — NOT CONFIGURABLE FROM THIS FILE.
# Measured 2026-07-30:
#   http://altftool.com/   -> 301 (CloudFront) -> https://altftool.com/
#   https://altftool.com/  -> 302              -> https://www.altftool.com/
# The 302 carries none of the security headers that withSecurityHeaders adds to
# "/:path*", so it is issued above the Next.js origin (Amplify domain
# management / CloudFront), not by next.config.mjs — there is no middleware and
# no host-based redirect in code. amplify.yml cannot express redirects, so the
# fix is a console change: Amplify Console -> Hosting -> Rewrites and redirects
# -> apex-to-www rule set to "301 (Permanent redirect)" (add an explicit rule if
# the auto-created domain redirect is not editable). A 302 does not consolidate
# ranking signals, and Search Console is currently reporting the same pages
# under both hostnames.
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24.15.0
        - nvm use 24.15.0
        - npm install --global npm@11.12.1 --no-audit --no-fund
        - export ALTFT_RELEASE_COMMIT="${AWS_COMMIT_ID:-$(git rev-parse HEAD)}"
        - export ALTFT_RELEASE_BRANCH="${AWS_BRANCH:-main}"
        - node scripts/write-amplify-runtime-env.mjs
        - npm ci --no-audit --no-fund
    build:
      commands:
        - export ALTFT_DEFER_BULK_PRERENDER=true
        - export ALTFT_BUILD_CPUS=1
        # Keep the compiler isolated, but cap the heap it inherits from
        # NODE_OPTIONS. Next's webpack build worker is a child process; giving
        # that child a 12 GiB old-space ceiling on LARGE_16GB left too little
        # room for the Next parent plus native, buffer and artifact allocations,
        # so the kernel killed the worker before V8 could report a heap OOM.
        #
        # 10240 is the measured passing ceiling for the current route graph.
        # Lowering old space by 2 GiB kept observed total/native RSS within the
        # builder limit; old-space size is not a total-process RSS limit. Keep
        # this aligned with scripts/run-with-node-memory.mjs and the runbook.
        - export ALTFT_NODE_MAX_OLD_SPACE_SIZE=10240
        - export ALTFT_WEBPACK_BUILD_WORKER=true
        - npm run build
        - rm -rf .next/cache
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
