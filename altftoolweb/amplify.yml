version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24.15.0
        - nvm use 24.15.0
        - npm install --global npm@11.12.1 --no-audit --no-fund
        - export ALTFT_RELEASE_COMMIT="${AWS_COMMIT_ID:-$(git rev-parse HEAD)}"
        - export ALTFT_RELEASE_BRANCH="${AWS_BRANCH:-main}"
        - node scripts/write-amplify-runtime-env.mjs
        - npm ci --no-audit --no-fund
    build:
      commands:
        - export ALTFT_DEFER_BULK_PRERENDER=true
        - export ALTFT_BUILD_CPUS=1
        - export ALTFT_NODE_MAX_OLD_SPACE_SIZE=10240
        - export ALTFT_WEBPACK_BUILD_WORKER=true
        - npm run build
        - rm -rf .next/cache
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
