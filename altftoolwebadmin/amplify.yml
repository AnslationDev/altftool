version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 24
        - node scripts/write-amplify-runtime-env.mjs
        - npm ci --no-audit --no-fund
    build:
      commands:
        - npm run build
        - rm -rf .next/cache
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
